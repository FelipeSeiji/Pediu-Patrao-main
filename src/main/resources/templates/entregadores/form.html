<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/entregadores}" class="btn btn-outline-secondary btn-sm" aria-label="Voltar">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0" th:text="${entregador.id == null ? 'Novo entregador' : 'Editar entregador'}"></h2>
    </div>
    <div class="card shadow-sm" style="max-width: 600px">
        <div class="card-body p-4">
            <form th:action="@{/entregadores/salvar}" th:object="${entregador}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" type="text" class="form-control" th:field="*{nome}" maxlength="120" required/>
                </div>
                <div class="mb-4">
                    <label for="telefone" class="form-label">Telefone</label>
                    <input id="telefone" type="tel" class="form-control" th:field="*{telefone}" maxlength="30" required/>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                    <a th:href="@{/entregadores}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
