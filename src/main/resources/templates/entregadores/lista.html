<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-bicycle me-2 text-primary"></i>Entregadores</h2>
        <a class="btn btn-primary" th:href="@{/entregadores/novo}">
            <i class="bi bi-plus-lg me-1"></i>Novo entregador
        </a>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Telefone</th>
                        <th>Situação</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(entregadores)}">
                        <td colspan="4" class="text-center text-muted py-5">Nenhum entregador cadastrado.</td>
                    </tr>
                    <tr th:each="entregador : ${entregadores}">
                        <td class="ps-4" th:text="${entregador.nome}"></td>
                        <td th:text="${entregador.telefone}"></td>
                        <td>
                            <span class="badge" th:classappend="${entregador.ativo} ? 'bg-success' : 'bg-secondary'"
                                  th:text="${entregador.ativo} ? 'Ativo' : 'Inativo'"></span>
                        </td>
                        <td class="text-end pe-4">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/entregadores/editar/{id}(id=${entregador.id})}" aria-label="Editar entregador">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form class="d-inline" th:action="@{/entregadores/{id}/status(id=${entregador.id})}" method="post">
                                <button class="btn btn-sm btn-outline-secondary" type="submit"
                                        th:text="${entregador.ativo} ? 'Desativar' : 'Reativar'"></button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
