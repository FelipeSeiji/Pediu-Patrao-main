<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Auditoria</title>
</head>
<body>
<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-shield-check me-2 text-primary"></i>Auditoria</h2>
        <span class="text-muted small" th:text="${#lists.size(registros)} + ' registro(s)'"></span>
    </div>
    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Data e hora</th>
                        <th>Usuário / perfil</th>
                        <th>Operação</th>
                        <th>Entidade</th>
                        <th>Valores anteriores</th>
                        <th>Valores novos</th>
                        <th>Justificativa</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(registros)}">
                        <td colspan="7" class="text-center text-muted py-5">Nenhum registro de auditoria.</td>
                    </tr>
                    <tr th:each="registro : ${registros}">
                        <td class="ps-4" th:text="${registro.dataHora}"></td>
                        <td><span th:text="${registro.usuario}"></span><br><small class="text-muted" th:text="${registro.perfil}"></small></td>
                        <td th:text="${registro.operacao}"></td>
                        <td><span th:text="${registro.entidade + ' #' + registro.entidadeId}"></span></td>
                        <td class="small" th:text="${registro.valoresAnteriores}"></td>
                        <td class="small" th:text="${registro.valoresNovos}"></td>
                        <td th:text="${registro.justificativa}"></td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
