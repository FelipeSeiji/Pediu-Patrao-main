<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-clock me-2 text-primary"></i>Horário de Funcionamento</h2>
    </div>
    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>
    <div class="card shadow-sm">
        <div class="card-body">
            <form th:action="@{/horarios}" th:object="${horarios}" method="post">
                <p class="text-muted">Defina o horário de abertura e fechamento para cada dia.</p>
                <div class="table-responsive">
                    <table class="table align-middle">
                        <thead>
                            <tr><th>Dia</th><th>Abertura</th><th>Fechamento</th><th>Fechado</th></tr>
                        </thead>
                        <tbody>
                            <tr th:each="dia, estado : *{dias}">
                                <td>
                                    <span th:text="${dia.dia}"></span>
                                    <input type="hidden" th:field="*{dias[__${estado.index}__].dia}"/>
                                </td>
                                <td>
                                    <input type="time" class="form-control" th:field="*{dias[__${estado.index}__].abertura}"
                                           th:disabled="${dia.fechado}"/>
                                </td>
                                <td>
                                    <input type="time" class="form-control" th:field="*{dias[__${estado.index}__].fechamento}"
                                           th:disabled="${dia.fechado}"/>
                                </td>
                                <td>
                                    <input type="checkbox" class="form-check-input" th:field="*{dias[__${estado.index}__].fechado}"
                                           th:attr="data-index=${estado.index}"/>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
                <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar horários</button>
            </form>
        </div>
    </div>
    <script>
        document.querySelectorAll('input[type="checkbox"][data-index]').forEach((fechado) => {
            fechado.addEventListener('change', () => {
                fechado.closest('tr').querySelectorAll('input[type="time"]').forEach((horario) => {
                    horario.disabled = fechado.checked;
                });
            });
        });
    </script>
</div>
