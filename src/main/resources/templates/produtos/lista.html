<div th:fragment="content">
    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0"><i class="bi bi-boxes me-2 text-primary"></i>Produtos</h2>
        <a class="btn btn-primary" th:href="@{/produtos/novo}"><i class="bi bi-plus-lg me-1"></i>Novo produto</a>
    </div>

    <div class="alert alert-success" th:if="${sucesso}" th:text="${sucesso}"></div>
    <div class="alert alert-danger" th:if="${erro}" th:text="${erro}"></div>

    <div class="card shadow-sm">
        <div class="table-responsive">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">Nome</th>
                        <th>Tipo</th>
                        <th>Preço</th>
                        <th>Ativo</th>
                        <th class="text-end pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:if="${#lists.isEmpty(produtos)}">
                        <td colspan="5" class="text-center text-muted py-5">Nenhum produto cadastrado.</td>
                    </tr>
                    <tr th:each="produto : ${produtos}">
                        <td class="ps-4" th:text="${produto.nome}"></td>
                        <td th:text="${produto.tipo}"></td>
                        <td th:text="${produto.preco != null ? #numbers.formatDecimal(produto.preco, 1, 'COMMA', 2, 'POINT') : '0,00'}"></td>
                        <td th:text="${produto.ativo == true ? 'Sim' : 'Não'}"></td>
                        <td class="text-end pe-4">
                            <a class="btn btn-sm btn-outline-primary" th:href="@{/produtos/editar/{id}(id=${produto.id})}" aria-label="Editar produto">
                                <i class="bi bi-pencil"></i>
                            </a>
                            <form class="d-inline" th:action="@{/produtos/deletar/{id}(id=${produto.id})}" method="post"
                                  onsubmit="return confirm('Deseja excluir este produto?')">
                                <button class="btn btn-sm btn-outline-danger" type="submit" aria-label="Excluir produto">
                                    <i class="bi bi-trash"></i>
                                </button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
