<div th:fragment="content">
    <div class="d-flex align-items-center gap-3 mb-4">
        <a th:href="@{/produtos}" class="btn btn-outline-secondary btn-sm" aria-label="Voltar">
            <i class="bi bi-arrow-left"></i>
        </a>
        <h2 class="fw-bold mb-0" th:text="${produto.id == null ? 'Novo produto' : 'Editar produto'}"></h2>
    </div>

    <div class="card shadow-sm" style="max-width: 640px">
        <div class="card-body p-4">
            <form th:action="@{/produtos/salvar}" th:object="${produto}" method="post">
                <input type="hidden" th:field="*{id}"/>
                <div class="mb-3">
                    <label for="nome" class="form-label">Nome</label>
                    <input id="nome" type="text" class="form-control" th:field="*{nome}" required/>
                </div>
                <div class="mb-3">
                    <label for="tipo" class="form-label">Tipo</label>
                    <select id="tipo" class="form-select" th:field="*{tipo}" required>
                        <option value="">Selecione</option>
                        <option value="Pizza">Pizza</option>
                        <option value="Lanche">Lanche</option>
                        <option value="Bebida">Bebida</option>
                        <option value="Porção">Porção</option>
                        <option value="Adicional">Adicional</option>
                    </select>
                </div>
                <div class="mb-3">
                    <label for="preco" class="form-label">Preço</label>
                    <input id="preco" type="number" min="0.01" step="0.01" class="form-control" th:field="*{preco}" required/>
                </div>
                <div class="mb-4">
                    <label for="ativo" class="form-label">Disponibilidade</label>
                    <select id="ativo" class="form-select" th:field="*{ativo}" required>
                        <option th:value="true">Ativo</option>
                        <option th:value="false">Inativo</option>
                    </select>
                </div>
                <div class="d-flex gap-2">
                    <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg me-1"></i>Salvar</button>
                    <a th:href="@{/produtos}" class="btn btn-outline-secondary">Cancelar</a>
                </div>
            </form>
        </div>
    </div>
</div>
