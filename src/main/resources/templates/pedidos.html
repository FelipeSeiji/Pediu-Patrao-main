<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Lista de Pedidos</title>
</head>
<body>

<div th:fragment="content">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2 class="fw-bold mb-0">
            <i class="bi bi-bag me-2 text-primary"></i>Pedidos
        </h2>
    </div>

    <!-- Mensagens de feedback -->
    <div class="alert alert-success alert-dismissible fade show" th:if="${sucesso}" role="alert">
        <i class="bi bi-check-circle-fill me-2"></i>
        <span th:text="${sucesso}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>
    <div class="alert alert-danger alert-dismissible fade show" th:if="${erro}" role="alert">
        <i class="bi bi-exclamation-triangle-fill me-2"></i>
        <span th:text="${erro}"></span>
        <button type="button" class="btn-close" data-bs-dismiss="alert"></button>
    </div>

    <div class="card shadow-sm mb-4" th:if="${podeRegistrarPedido}">
        <div class="card-body">
            <h5 class="fw-bold mb-3">Registrar pedido</h5>
            <form th:action="@{/pedidos/salvar}" th:object="${pedido}" method="post" class="row g-3 align-items-end">
                <div class="col-md-4">
                    <label class="form-label" for="clienteId">Cliente</label>
                    <select id="clienteId" class="form-select" th:field="*{clienteId}" required>
                        <option value="">Selecione um cliente</option>
                        <option th:each="cliente : ${clientes}" th:value="${cliente.id}" th:text="${cliente.nome + ' - ' + cliente.telefone}"></option>
                    </select>
                </div>
                <div class="col-12" id="itensPedido">
                    <div class="pedido-item row g-2 align-items-end mb-2">
                        <div class="col-md-8">
                            <label class="form-label">Produto</label>
                            <select class="form-select" name="itens[0].produtoId" required>
                                <option value="">Selecione um produto</option>
                                <option th:each="produto : ${produtos}" th:if="${produto.ativo != false}"
                                        th:value="${produto.id}" th:text="${produto.nome + ' - R$ ' + produto.preco}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Quantidade</label>
                            <input type="number" name="itens[0].quantidade" min="1" max="99" value="1" class="form-control" required/>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger w-100 remover-item" aria-label="Remover item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </div>
                <template id="modeloItemPedido">
                    <div class="pedido-item row g-2 align-items-end mb-2">
                        <div class="col-md-8">
                            <label class="form-label">Produto</label>
                            <select class="form-select" name="itens[__index__].produtoId" required>
                                <option value="">Selecione um produto</option>
                                <option th:each="produto : ${produtos}" th:if="${produto.ativo != false}"
                                        th:value="${produto.id}" th:text="${produto.nome + ' - R$ ' + produto.preco}"></option>
                            </select>
                        </div>
                        <div class="col-md-2">
                            <label class="form-label">Quantidade</label>
                            <input type="number" name="itens[__index__].quantidade" min="1" max="99" value="1" class="form-control" required/>
                        </div>
                        <div class="col-md-2">
                            <button type="button" class="btn btn-outline-danger w-100 remover-item" aria-label="Remover item">
                                <i class="bi bi-trash"></i>
                            </button>
                        </div>
                    </div>
                </template>
                <div class="col-md-2">
                    <button type="button" id="adicionarItem" class="btn btn-outline-secondary w-100">
                        <i class="bi bi-plus-lg me-1"></i>Adicionar item
                    </button>
                </div>
                <div class="col-md-2">
                    <button type="submit" class="btn btn-primary w-100"><i class="bi bi-check-lg me-1"></i>Registrar pedido</button>
                </div>
            </form>
        </div>
    </div>

    <!-- Tabela -->
    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th class="ps-4">ID</th>
                        <th>Cliente ID</th>
                        <th>Itens</th>
                        <th>Subtotal</th>
                        <th>Desconto</th>
                        <th>Total</th>
                        <th>Status</th>
                        <th>Entrada / saída</th>
                        <th class="pe-4">Ações</th>
                    </tr>
                </thead>
                <tbody>
                    <!-- Lista vazia -->
                    <tr th:if="${#lists.isEmpty(pedidos)}">
                        <td colspan="9" class="text-center text-muted py-5">
                            <i class="bi bi-inbox fs-3 d-block mb-2"></i>
                            Nenhum pedido encontrado.
                        </td>
                    </tr>
                    <!-- Linhas -->
                    <tr th:each="pedido : ${pedidos}">
                        <td class="ps-4 text-muted" th:text="${pedido.id}"></td>
                        <td th:text="${pedido.clienteId}"></td>
                        <td>
                            <span th:if="${#lists.isEmpty(pedido.itens)}" th:text="${pedido.tipoPizza + ' - ' + pedido.sabor + ' x ' + pedido.quantidade}"></span>
                            <span th:each="item : ${pedido.itens}" class="d-block" th:text="${item.nomeProduto + ' x ' + item.quantidade}"></span>
                        </td>
                        <td th:text="${pedido.subtotal}"></td>
                        <td th:text="${pedido.descontoPercentual + '% (' + pedido.valorDesconto + ')'}"></td>
                        <td class="fw-bold" th:text="${pedido.valorTotal}"></td>
                        <td>
                            <span class="badge"
                                  th:classappend="${pedido.status == 'FINALIZADO' or pedido.status == 'ENTREGUE' or pedido.status == 'RETIRADO'} ? 'bg-success' :
                                                  (${pedido.status == 'CANCELADO'} ? 'bg-danger' :
                                                  (${pedido.status == 'EM_PREPARACAO' or pedido.status == 'EM_PREPARO'} ? 'bg-warning text-dark' : 'bg-secondary'))"
                                  th:text="${pedido.status}">
                            </span>
                        </td>
                        <td class="small">
                            <span class="d-block" th:text="${pedido.dataHoraEntrada}"></span>
                            <span class="text-muted" th:if="${pedido.dataHoraSaida != null}" th:text="${pedido.responsavelSaida + ' · ' + pedido.dataHoraSaida}"></span>
                        </td>
                        <td class="pe-4">
                            <form th:if="${podeAtualizarPedido and pedido.status == 'RECEBIDO'}" th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="mb-2">
                                <input type="hidden" name="status" value="EM_PREPARACAO"/>
                                <button class="btn btn-sm btn-outline-primary">Enviar à cozinha</button>
                            </form>
                            <form th:if="${podeAtualizarPedido and pedido.status == 'EM_PREPARACAO'}" th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="mb-2">
                                <input type="hidden" name="status" value="PRONTO"/>
                                <button class="btn btn-sm btn-outline-primary">Marcar pronto</button>
                            </form>
                            <form th:if="${podeAtualizarPedido and pedido.status == 'PRONTO'}" th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="mb-2">
                                <select name="status" class="form-select form-select-sm mb-1">
                                    <option value="SAIU_PARA_ENTREGA">Saiu para entrega</option>
                                    <option value="RETIRADO">Retirado</option>
                                </select>
                                <button class="btn btn-sm btn-outline-primary">Registrar saída</button>
                            </form>
                            <form th:if="${podeAtualizarPedido and (pedido.status == 'SAIU_PARA_ENTREGA' or pedido.status == 'RETIRADO')}" th:action="@{/pedidos/{id}/status(id=${pedido.id})}" method="post" class="mb-2">
                                <input type="hidden" name="status" value="FINALIZADO"/>
                                <button class="btn btn-sm btn-outline-success">Finalizar</button>
                            </form>
                            <form th:if="${podeGerenciarPedido and pedido.status != 'CANCELADO' and pedido.status != 'FINALIZADO' and pedido.status != 'SAIU_PARA_ENTREGA' and pedido.status != 'RETIRADO'}"
                                  th:action="@{/pedidos/{id}/desconto(id=${pedido.id})}" method="post" class="mb-2">
                                <div class="input-group input-group-sm">
                                    <input type="number" name="percentual" min="0.01" max="20" step="0.01" class="form-control" placeholder="%" required/>
                                    <button class="btn btn-outline-warning">Desconto</button>
                                </div>
                            </form>
                            <form th:if="${podeGerenciarPedido and pedido.status != 'CANCELADO' and pedido.status != 'FINALIZADO' and pedido.status != 'SAIU_PARA_ENTREGA' and pedido.status != 'RETIRADO'}"
                                  th:action="@{/pedidos/{id}/cancelar(id=${pedido.id})}" method="post">
                                <input type="text" name="justificativa" class="form-control form-control-sm mb-1" placeholder="Justificativa" required/>
                                <button class="btn btn-sm btn-outline-danger">Cancelar</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
        <div class="card-footer text-muted small" th:if="${!#lists.isEmpty(pedidos)}">
            Total: <strong th:text="${#lists.size(pedidos)}"></strong> pedido(s)
        </div>
    </div>

</div>

<script>
    const itensPedido = document.getElementById('itensPedido');
    if (itensPedido) {
        const modeloItemPedido = document.getElementById('modeloItemPedido');

        function reindexarItens() {
            const linhas = [...itensPedido.querySelectorAll('.pedido-item')];
            linhas.forEach((linha, indice) => {
                linha.querySelector('select').name = `itens[${indice}].produtoId`;
                linha.querySelector('input[type="number"]').name = `itens[${indice}].quantidade`;
                linha.querySelector('.remover-item').disabled = linhas.length === 1;
            });
        }

        document.getElementById('adicionarItem').addEventListener('click', () => {
            const indice = itensPedido.querySelectorAll('.pedido-item').length;
            itensPedido.insertAdjacentHTML('beforeend', modeloItemPedido.innerHTML.replaceAll('__index__', indice));
            reindexarItens();
        });

        itensPedido.addEventListener('click', (evento) => {
            const botao = evento.target.closest('.remover-item');
            if (botao && itensPedido.querySelectorAll('.pedido-item').length > 1) {
                botao.closest('.pedido-item').remove();
                reindexarItens();
            }
        });

        reindexarItens();
    }
</script>

</body>
</html>
