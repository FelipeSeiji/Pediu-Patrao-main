name: Testes do Pediu Patrão
on:
  push:
    branches: [main, develop, 'codex/**', 'feature/**']
  pull_request:
    branches: [main, develop]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      mongodb:
        image: mongo:8.0
        ports: ['27017:27017']
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1}).ok'"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      MONGODB_TEST_URI: mongodb://localhost:27017/pediupatrao_dashboard_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Verificar aplicação e integração com MongoDB
        run: mvn -B verify
      - name: Preservar relatórios de testes
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports/
